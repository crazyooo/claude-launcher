<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">主路径：声明代理 → 检测 → 可选防直连</title>
  <desc id="desc">三个步骤：标记代理已开，一键检测 Desktop/CLI，可选开启防 Anthropic 直连。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10281F"/>
      <stop offset="100%" stop-color="#0A1A14"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="357" rx="26.5" fill="none" stroke="#2B5343" stroke-width="1.5"/>
  <text x="56" y="56" fill="#B7D0C3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">HOW IT WORKS</text>
  <text x="56" y="96" fill="#F3EEE4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="32" font-weight="700">打开后的三条主路径</text>
  <g transform="translate(56 140)">
    <rect width="340" height="160" rx="18" fill="#153327" stroke="#2F5A47" stroke-width="1.5"/>
    <text x="28" y="42" fill="#E8A070" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">01</text>
    <text x="28" y="82" fill="#F3EEE4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24" font-weight="600">已开代理</text>
    <text x="28" y="116" fill="#8FA898" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17">只记你的声明</text>
    <text x="28" y="142" fill="#8FA898" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17">不改系统代理设置</text>
  </g>
  <path d="M412 220 H444" stroke="#3A6B56" stroke-width="3" stroke-linecap="round"/>
  <polygon points="444,212 462,220 444,228" fill="#3A6B56"/>
  <g transform="translate(478 140)">
    <rect width="340" height="160" rx="18" fill="#153327" stroke="#2F5A47" stroke-width="1.5"/>
    <text x="28" y="42" fill="#E8A070" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">02</text>
    <text x="28" y="82" fill="#F3EEE4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="24" font-weight="600">一键检测</text>
    <text x="28" y="116" fill="#8FA898" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17">入口 · Desktop · CLI</text>
    <text x="28" y="142" fill="#8FA898" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17">结论回填第一屏</text>
  </g>
  <path d="M834 220 H866" stroke="#3A6B56" stroke-width="3" stroke-linecap="round"/>
  <polygon points="866,212 884,220 866,228" fill="#3A6B56"/>
  <g transform="translate(900 140)">
    <rect width="244" height="160" rx="18" fill="#2A211C" stroke="#8B5A42" stroke-width="1.5"/>
    <text x="24" y="42" fill="#E8A070" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">03</text>
    <text x="24" y="82" fill="#F3EEE4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="600">防直连</text>
    <text x="24" y="116" fill="#C4A090" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16">可选 · 需管理员</text>
    <text x="24" y="142" fill="#C4A090" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16">拦 Anthropic 直连</text>
  </g>
</svg>
